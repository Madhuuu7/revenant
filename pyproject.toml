[project]
name = "revenant"
version = "0.1.0"
description = "A durable agent runtime: event-sourced, crash-resumable, deterministic on replay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.8"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
